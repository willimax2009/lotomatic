<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LotoMatic - Suivi en direct</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTUiIGZpbGw9IiNjOTlhMzUiLz48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxMSIgZmlsbD0iIzBlMmEyOCIvPjx0ZXh0IHg9IjE2IiB5PSIyMSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsJ0RlamFWdSBTZXJpZicsc2VyaWYiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMTMiIGZpbGw9IiNmMWRmYWUiPjkwPC90ZXh0Pjwvc3ZnPg==">
<meta name="theme-color" content="#0a1c1b">
<style>
:root{--pa:#d6a843;--fg:#eef3f2;--soft:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--chip:rgba(255,255,255,.12);--cell:rgba(238,243,242,.55);--on:#1a1205}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(ellipse at 30% 0%,#14403b 0%,#0a1c1b 70%) fixed;color:var(--fg);-webkit-tap-highlight-color:transparent;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.light{--soft:rgba(0,0,0,.06);--line:rgba(0,0,0,.16);--chip:rgba(0,0,0,.09);--cell:rgba(20,32,31,.55);--on:#fff}
.app{max-width:560px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.25rem;color:var(--pa)}
.assoc{flex:1;text-align:right;font-size:.85rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;font-size:.78rem;opacity:.85;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:#f87171;transition:background .3s}
.dot.on{background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.game{text-align:center;font-size:.95rem;opacity:.8;min-height:1.2em}
.hero{display:flex;align-items:center;gap:16px;padding:14px;border-radius:18px;background:var(--soft);border:1px solid var(--line)}
.ball{flex:none;width:min(34vw,150px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:min(15vw,70px);color:#3b2405;background:radial-gradient(circle at 35% 30%,#fef9c3,#f59e0b 55%,#78350f);border:4px solid var(--pa);box-shadow:0 8px 24px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;will-change:transform}
.ball.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-14deg);opacity:.2}100%{transform:none;opacity:1}}
.meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.step{font-weight:700;font-size:1.15rem;color:var(--pa)}
.lot{font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.donor,.cons{font-size:.85rem;opacity:.72;overflow-wrap:anywhere}
.recent{display:flex;gap:8px;flex-wrap:wrap;min-height:40px}
.chip{min-width:42px;height:42px;padding:0 10px;border-radius:21px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.chip:first-child{background:var(--pa);color:var(--on)}
.count{font-size:.85rem;opacity:.72;text-align:center}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:clamp(.62rem,2.9vw,.85rem);font-weight:600;color:var(--cell);font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.cell.on{background:var(--pa);color:var(--on)}
.cell.last{box-shadow:0 0 0 2px var(--fg);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.wait{padding:32px 18px;text-align:center;border-radius:18px;background:var(--soft);border:1px dashed var(--line);line-height:1.5}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--pa);border-radius:50%;animation:rot 1s linear infinite;margin-bottom:10px}
@keyframes rot{to{transform:rotate(360deg)}}
.pause{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:inherit}
.pause.on{display:flex}
.pause h2{font-family:Georgia,serif;font-size:2.4rem;color:var(--pa)}
.pause p{font-size:1.2rem;margin:10px 0 18px;max-width:420px}
.pause .t{font-size:4.2rem;font-weight:600;color:var(--pa);font-variant-numeric:tabular-nums}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.login{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:.92rem;transition:background .15s,transform .1s}
.login:active{transform:scale(.97);background:var(--soft)}
.small{font-size:.75rem;opacity:.55}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">LotoMatic</div><div class="assoc" id="assoc"></div><div class="live"><span class="dot" id="dot"></span><span id="state">Connexion…</span></div></div>
  <div class="wait" id="wait"><div class="spin"></div><div id="waitMsg">En attente du début de la partie…</div></div>
  <div id="main" hidden>
    <div class="game" id="game"></div>
    <div class="hero" style="margin-top:10px"><div class="ball" id="ball">--</div>
      <div class="meta"><div class="step" id="step"></div><div class="lot" id="lot"></div><div class="donor" id="donor"></div><div class="cons" id="cons"></div></div></div>
    <div class="recent" id="recent" style="margin-top:14px"></div>
    <div class="count" id="count" style="margin:12px 0 8px"></div>
    <div class="board" id="board"></div>
  </div>
  <div class="foot"><a class="login" href="./">Se connecter à LotoMatic</a><div class="small">Suivi en direct des numéros</div></div>
</div>
<div class="pause" id="pause"><h2>Entracte</h2><p id="pauseMsg"></p><div class="t" id="pauseT"></div></div>

<script>
/* Adresse de la base « Realtime Database » du projet Firebase (la même que dans index.html) */
const DB_URL = "https://lotomatic-f4d0a-default-rtdb.europe-west1.firebasedatabase.app";

const THEMES = {
  classic: ['#d6a843', '#14403b', '#0a1c1b'], ocean: ['#7fd4ff', '#0f4560', '#06141d'], foret: ['#b6e07a', '#17482b', '#08170e'],
  bordeaux: ['#f0b7a4', '#5b1426', '#1f070d'], violet: ['#c3a6ff', '#33205e', '#0e0a1c'], ardoise: ['#9db8ff', '#22315c', '#0a0e1a'],
  emeraude: ['#6ee7a8', '#0b4a37', '#03150f'], rubis: ['#ff8a9b', '#6a1020', '#1c050a'], saphir: ['#8fb4ff', '#14337a', '#050d26'],
  mandarine: ['#ffb347', '#6a3207', '#1a0b02'], etoile: ['#ffd76a', '#241a5a', '#05030f'], graphite: ['#e9eef0', '#2e3238', '#0c0d10'],
  neon: ['#37f5d4', '#2a0a52', '#06000f'], noir: ['#e3b341', '#000', '#000'],
  clair: ['#0e5a52', '#f1f4f3', '#cdd7d5', 1], ciel: ['#0b5cad', '#eef6ff', '#cfe3f7', 1], menthe: ['#0e6b4a', '#eefaf3', '#c9ecd9', 1],
  rose: ['#a3204a', '#fff2f6', '#f5cfd9', 1], sable: ['#8a5a12', '#f7f1e3', '#e6d8b8', 1],
  pink: ['#f6a8cb', '#6a1b45', '#2b0a1c'], halloween: ['#ff9a3c', '#4a2008', '#150a03'], noel: ['#f2c75c', '#6b1118', '#1a0406'], valentin: ['#ffb3c7', '#7a1235', '#240510']
};
const $ = id => document.getElementById(id);
const K = (new URLSearchParams(location.search).get('k') || '').replace(/[^A-Za-z0-9_-]/g, '');
const URL_LIVE = DB_URL.replace(/\/+$/, '') + '/live/' + K + '.json';

/* grille 1 à 90, construite une seule fois */
const board = $('board'), cells = [];
for (let i = 1; i <= 90; i++) { const c = document.createElement('div'); c.className = 'cell'; c.textContent = i; board.appendChild(c); cells[i] = c; }

let cur = null, prev = new Set(), lastNum = null, themeId = '', pauseRemain0 = 0, pauseRecv = 0, es = null, errs = 0, pollT = null, raf = 0;
const toArr = v => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === 'object' ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : []);

function setState(on, txt) { $('dot').classList.toggle('on', on); $('state').textContent = txt || (on ? 'En direct' : 'Reconnexion…'); }
function applyTheme(id) {
  if (id === themeId) return; themeId = id;
  const t = THEMES[id] || THEMES.classic, st = document.documentElement.style;
  st.setProperty('--pa', t[0]); st.setProperty('--fg', t[3] ? '#14201f' : '#eef3f2');
  document.body.classList.toggle('light', !!t[3]);
  document.body.style.background = 'radial-gradient(ellipse at 30% 0%, ' + t[1] + ' 0%, ' + t[2] + ' 70%) fixed';
  document.querySelector('meta[name=theme-color]').setAttribute('content', t[2]);
}
function render() {
  raf = 0; const d = cur;
  if (!d || typeof d !== 'object') { $('wait').hidden = false; $('main').hidden = true; $('pause').classList.remove('on'); return; }
  $('wait').hidden = true; $('main').hidden = false;
  applyTheme(d.theme);
  $('assoc').textContent = d.assoc || '';
  $('game').textContent = d.game || '';
  $('step').textContent = d.step && d.step !== '--' ? d.step : '';
  $('lot').textContent = d.lot && d.lot !== '--' ? d.lot : '';
  $('donor').textContent = d.donor ? 'Donateur : ' + d.donor : '';
  $('cons').textContent = d.cons ? "Lot de consolation en cas d'égalité : " + d.cons : '';
  const drawn = toArr(d.drawn).map(Number).filter(n => n >= 1 && n <= 90), set = new Set(drawn), last = drawn.length ? drawn[drawn.length - 1] : null;
  prev.forEach(n => { if (!set.has(n)) cells[n].className = 'cell'; });
  set.forEach(n => { cells[n].className = 'cell on' + (n === last ? ' last' : ''); });
  prev = set;
  const ball = $('ball');
  if (last !== lastNum) { ball.textContent = last == null ? '--' : last; ball.classList.remove('pop'); void ball.offsetWidth; if (last != null) ball.classList.add('pop'); lastNum = last; }
  $('recent').innerHTML = drawn.slice(-8).reverse().map(n => '<div class="chip">' + n + '</div>').join('');
  $('count').textContent = drawn.length ? drawn.length + (drawn.length > 1 ? ' numéros sortis' : ' numéro sorti') + ' sur 90' : 'Aucun numéro tiré pour le moment';
  if (d.paused) {
    $('pauseMsg').textContent = d.pauseMsg || ''; $('pause').classList.add('on'); tickPause();
  } else $('pause').classList.remove('on');
}
function tickPause() {
  if (!$('pause').classList.contains('on')) return;
  const left = Math.max(0, Math.ceil(pauseRemain0 - (performance.now() - pauseRecv) / 1000));
  $('pauseT').textContent = left > 0 ? String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0') : 'Reprise imminente';
}
setInterval(tickPause, 500);
function received() {                              // calcule le temps d'entracte restant sans dépendre de l'horloge du téléphone
  if (cur && cur.paused) { pauseRemain0 = Math.max(0, ((+cur.pauseEnd || 0) - (+cur.t || 0)) / 1000); pauseRecv = performance.now(); }
  if (!raf) raf = requestAnimationFrame(render);   // un seul dessin par image, même si plusieurs messages arrivent
}
function setPath(obj, path, val) {
  const p = path.split('/').filter(Boolean); if (!p.length) return val;
  obj = obj && typeof obj === 'object' ? obj : {}; let o = obj;
  for (let i = 0; i < p.length - 1; i++) { if (!o[p[i]] || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
  o[p[p.length - 1]] = val; return obj;
}
function connect() {
  if (!window.EventSource) return poll();
  es = new EventSource(URL_LIVE);
  es.addEventListener('put', e => { errs = 0; setState(true); try { const m = JSON.parse(e.data); cur = setPath(cur, m.path || '/', m.data); received(); } catch (_) {} });
  es.addEventListener('patch', e => { errs = 0; setState(true); try { const m = JSON.parse(e.data); Object.keys(m.data || {}).forEach(k => { cur = setPath(cur, (m.path || '/') + '/' + k, m.data[k]); }); received(); } catch (_) {} });
  es.addEventListener('keep-alive', () => setState(true));
  es.addEventListener('cancel', () => { es.close(); poll(); });
  es.onerror = () => { setState(false); if (++errs >= 4) { es.close(); poll(); } };
}
function poll() {                                   // solution de secours si la connexion continue n'est pas possible
  if (pollT) return;
  const go = async () => {
    try { const r = await fetch(URL_LIVE, { cache: 'no-store' }); if (r.ok) { cur = await r.json(); setState(true); received(); } else setState(false); }
    catch (_) { setState(false); }
  };
  go(); pollT = setInterval(go, 2000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (es && es.readyState === 2 && !pollT) connect();
  fetch(URL_LIVE, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => { if (d) { cur = d; received(); } }).catch(() => {});
});

if (!K) { $('waitMsg').textContent = "Ce lien n'est pas valide. Scannez de nouveau le QR code affiché dans la salle."; $('state').textContent = ''; document.querySelector('.spin').hidden = true; }
else if (!DB_URL) { $('waitMsg').textContent = "Le suivi en direct n'est pas encore configuré."; $('state').textContent = ''; }
else connect();
</script>
</body>
</html>
